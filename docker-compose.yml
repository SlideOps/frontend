# A fixed project name so this stack never collides with a directory that
# happens to be named frontend.
name: slideops-frontend

services:
  web:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm --filter @slideops/web dev --host 0.0.0.0"
    ports:
      - "4321:4321"
    volumes:
      - ./:/workspace
    environment:
      - NODE_ENV=development
